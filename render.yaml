services:
  - type: web
    name: stokly-stock-opname
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: stokly-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
